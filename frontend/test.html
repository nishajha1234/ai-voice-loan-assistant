<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>AI Voice Assistant Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }

        #start {
            background: green;
            color: white;
        }

        #stop {
            background: red;
            color: white;
        }

        #status {
            margin-top: 20px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        #transcript {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-height: 180px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        #logs {
            margin-top: 20px;
            background: black;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            height: 260px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }

        .final-text {
            color: #111;
        }

        .interim-text {
            color: #777;
        }

    </style>

</head>

<body>

    <h2>
        Realtime AI Voice Assistant
    </h2>

    <button id="start">
        Start Recording
    </button>

    <button
        id="stop"
        disabled
    >
        Stop Recording
    </button>

    <div id="status">
        Status: Idle
    </div>

    <div id="transcript">
        Waiting for transcript...
    </div>

    <div id="logs"></div>

    <script>

        const startButton =
            document.getElementById("start");

        const stopButton =
            document.getElementById("stop");

        const transcriptDiv =
            document.getElementById("transcript");

        const logsDiv =
            document.getElementById("logs");

        const statusDiv =
            document.getElementById("status");

        let ws = null;

        let audioContext = null;

        let processor = null;

        let input = null;

        let globalStream = null;

        let isRecording = false;

        let keepAliveInterval = null;

        let finalTranscript = "";


        function updateStatus(message) {

            statusDiv.innerHTML =
                `Status: ${message}`;
        }


        function log(message) {

            console.log(message);

            const logLine =
                document.createElement("div");

            logLine.textContent = message;

            logsDiv.appendChild(logLine);

            logsDiv.scrollTop =
                logsDiv.scrollHeight;
        }


        function renderTranscript(
            interimTranscript = ""
        ) {

            transcriptDiv.innerHTML = `
                <div class="final-text">
                    ${finalTranscript}
                </div>

                <div class="interim-text">
                    ${interimTranscript}
                </div>
            `;
        }


        function floatTo16BitPCM(input) {

            const buffer =
                new ArrayBuffer(
                    input.length * 2
                );

            const view =
                new DataView(buffer);

            let offset = 0;

            for (let i = 0; i < input.length; i++) {

                let sample = Math.max(
                    -1,
                    Math.min(1, input[i])
                );

                view.setInt16(
                    offset,
                    sample < 0
                        ? sample * 0x8000
                        : sample * 0x7FFF,
                    true
                );

                offset += 2;
            }

            return buffer;
        }


        async function connectWebSocket() {

            return new Promise((resolve, reject) => {

                const websocketProtocol =
                    window.location.protocol === "https:"
                        ? "wss"
                        : "ws";

                const websocketHost =
                    "127.0.0.1";

                const websocketPort =
                    "8000";

                const websocketUrl =
                    `${websocketProtocol}://${websocketHost}:${websocketPort}/ws`;

                log(
                    `Connecting to ${websocketUrl}`
                );

                ws = new WebSocket(websocketUrl);

                ws.binaryType = "arraybuffer";

                ws.onopen = () => {

                    log(
                        "WebSocket connected"
                    );

                    updateStatus(
                        "WebSocket Connected"
                    );

                    startKeepAlive();

                    resolve();
                };

                ws.onmessage = (event) => {

                    try {

                        const parsed =
                            JSON.parse(event.data);

                        if (
                            parsed.type === "transcript"
                        ) {

                            const transcript =
                                parsed.data.transcript;

                            const isFinal =
                                parsed.data.is_final;

                            if (!transcript) {
                                return;
                            }

                            if (isFinal) {

                                finalTranscript +=
                                    transcript + " ";

                                renderTranscript();

                            } else {

                                renderTranscript(
                                    transcript
                                );
                            }
                        }

                    } catch (error) {

                        log(
                            `Message parse error: ${error}`
                        );
                    }
                };

                ws.onerror = (error) => {

                    log(
                        "WebSocket error"
                    );

                    updateStatus(
                        "WebSocket Error"
                    );

                    reject(error);
                };

                ws.onclose = () => {

                    log(
                        "WebSocket closed"
                    );

                    updateStatus(
                        "Disconnected"
                    );

                    stopKeepAlive();
                };
            });
        }


        function startKeepAlive() {

            keepAliveInterval =
                setInterval(() => {

                    if (
                        ws &&
                        ws.readyState === WebSocket.OPEN
                    ) {

                        ws.send(
                            JSON.stringify({
                                type: "ping"
                            })
                        );
                    }

                }, 15000);
        }


        function stopKeepAlive() {

            if (keepAliveInterval) {

                clearInterval(
                    keepAliveInterval
                );
            }
        }


        async function startRecording() {

            try {

                finalTranscript = "";

                renderTranscript();

                await connectWebSocket();

                globalStream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: {
                            channelCount: 1,
                            sampleRate: 16000,
                            echoCancellation: true,
                            noiseSuppression: true
                        }
                    });

                audioContext =
                    new AudioContext({
                        sampleRate: 16000
                    });

                input =
                    audioContext.createMediaStreamSource(
                        globalStream
                    );

                processor =
                    audioContext.createScriptProcessor(
                        4096,
                        1,
                        1
                    );

                processor.onaudioprocess = (
                    event
                ) => {

                    if (!isRecording) {
                        return;
                    }

                    const inputData =
                        event.inputBuffer.getChannelData(0);

                    const pcmData =
                        floatTo16BitPCM(inputData);

                    if (
                        ws &&
                        ws.readyState === WebSocket.OPEN
                    ) {

                        ws.send(pcmData);
                    }
                };

                input.connect(processor);

                processor.connect(
                    audioContext.destination
                );

                isRecording = true;

                updateStatus(
                    "Recording..."
                );

                log(
                    "Recording started"
                );

                startButton.disabled = true;

                stopButton.disabled = false;

            } catch (error) {

                console.error(error);

                log(
                    `Recording error: ${error}`
                );

                updateStatus(
                    "Recording Failed"
                );
            }
        }


        async function stopRecording() {

            try {

                isRecording = false;

                if (processor) {

                    processor.disconnect();

                    processor = null;
                }

                if (input) {

                    input.disconnect();

                    input = null;
                }

                if (audioContext) {

                    await audioContext.close();

                    audioContext = null;
                }

                if (globalStream) {

                    globalStream
                        .getTracks()
                        .forEach(track => track.stop());

                    globalStream = null;
                }

                if (ws) {

                    ws.close();

                    ws = null;
                }

                stopKeepAlive();

                updateStatus(
                    "Recording Stopped"
                );

                log(
                    "Recording stopped"
                );

            } catch (error) {

                log(
                    `Stop recording error: ${error}`
                );
            }

            startButton.disabled = false;

            stopButton.disabled = true;
        }


        startButton.onclick =
            startRecording;

        stopButton.onclick =
            stopRecording;

    </script>

</body>

</html>
